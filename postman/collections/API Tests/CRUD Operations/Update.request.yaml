$kind: http-request
order: 4000
method: PUT
url: '{{baseUrl}}/{{apiVersion}}/resources/{{resourceId}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{apiKey}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Resource",
      "description": "Updated via Postman"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
