$kind: http-request
order: 1000
method: GET
url: 'https://restcountries.com/v3.1/all?fields=name,capital,population,flags'
queryParams:
  - key: fields
    value: 'name,capital,population,flags'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns country list", () => {
          const data = pm.response.json();
          pm.expect(data).to.be.an('array');
          pm.expect(data.length).to.be.above(100);
      });
